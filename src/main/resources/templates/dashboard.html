<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Dashboard</title>
  <link rel="stylesheet" href="/app.css" />
  <script defer src="/dashboard.js"></script>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-top">
        <div>
          <p class="eyebrow" th:text="${isManager} ? 'Manager View' : 'Employee View'"></p>
          <h1 th:text="${dashboardTitle}"></h1>
          <p class="subtle" th:text="${dashboardSubtitle}"></p>
        </div>
        <div class="meta-row">
          <span class="badge" th:text="${currentUser.displayName}"></span>
          <span class="badge" th:classappend="${isManager} ? ' role-manager' : ' role-employee'" th:text="${currentUser.role}"></span>
        </div>
      </div>

      <div class="toolbar">
        <form action="/" method="get" class="filters">
          <input th:if="${!isManager and teamBacklogView}" type="hidden" name="view" value="team-backlog" />
          <div class="field">
            <label for="project">Project</label>
            <select id="project" name="project">
              <option value="">All projects</option>
              <option th:each="projectOption : ${projects}"
                      th:value="${projectOption}"
                      th:text="${projectOption}"
                      th:selected="${projectOption == projectFilter}"></option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="">All priorities</option>
              <option th:each="priorityOption : ${priorities}"
                      th:value="${priorityOption}"
                      th:text="${priorityOption}"
                      th:selected="${priorityOption == selectedPriority}"></option>
            </select>
          </div>
          <button type="submit">Apply Filters</button>
        </form>

        <div class="action-row">
          <div th:if="${!isManager}" class="view-toggle">
            <a class="button-link secondary" th:classappend="${!teamBacklogView} ? ' active-toggle' : ''" th:href="@{/(project=${projectFilter},priority=${selectedPriority})}">My Work</a>
            <a class="button-link secondary" th:classappend="${teamBacklogView} ? ' active-toggle' : ''" th:href="@{/(view='team-backlog',project=${projectFilter},priority=${selectedPriority})}">Team Backlog</a>
          </div>
          <a th:if="${isManager}" class="button-link" th:href="@{/create}">New Task</a>
          <a th:if="${isManager}" class="button-link secondary" th:href="@{/archived}">Archived Tasks</a>
          <form action="/logout" method="post" class="inline-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="secondary">Logout</button>
          </form>
        </div>
      </div>

      <div th:if="${message}" class="notice success" th:text="${message}"></div>
      <div th:if="${error}" class="notice error" th:text="${error}"></div>
    </section>

    <p th:if="${#lists.isEmpty(items)}" class="subtle">No tasks matched the current filters.</p>

    <section class="board-shell" th:if="${!#lists.isEmpty(items)}">
      <div class="board-caption">
        <p class="subtle" th:text="${boardHint}"></p>
      </div>

      <section class="board" th:classappend="${!isManager and teamBacklogView} ? ' board-single' : ''">
        <article class="board-column" th:each="column : ${boardColumns}" th:attr="data-drop-status=${column.status}">
          <h2 th:text="${column.label}"></h2>
          <p class="column-count" th:text="${#lists.size(column.items) + ' item(s)'}"></p>
          <p th:if="${#lists.isEmpty(column.items)}" class="subtle">No items in this lane.</p>

          <div th:if="${!#lists.isEmpty(column.items)}" class="task-list">
            <section class="task-card"
                     th:each="item : ${column.items}"
                     draggable="true"
                     tabindex="0"
                     th:attr="data-item-id=${item.id},
                              data-title=${item.title},
                              data-description=${item.description},
                              data-project=${item.project},
                              data-priority=${item.priority},
                              data-status=${item.status},
                              data-task-type=${item.taskType},
                              data-assignee=${item.assignee.displayName},
                              data-created-by=${item.createdBy.displayName},
                              data-due-date=${item.dueDate != null ? #temporals.format(item.dueDate, 'MMM d, yyyy') : 'No due date'},
                              data-created-at=${item.createdAt != null ? #temporals.format(item.createdAt, 'MMM d, yyyy h:mm a') : 'Unknown'},
                              data-edit-url=${isManager ? '/items/' + item.id + '/edit' : ''},
                              data-detail-url=${'/items/' + item.id},
                              data-archive-url=${isManager ? '/items/' + item.id + '/archive' : ''},
                              data-claim-url=${!isManager && teamBacklogView && item.status.name() == 'BACKLOG' ? '/items/' + item.id + '/claim' : ''},
                              data-can-edit=${isManager},
                              data-can-archive=${isManager},
                              data-can-claim=${!isManager && teamBacklogView && item.status.name() == 'BACKLOG'},
                              data-role=${isManager ? 'manager' : 'employee'}">
              <div class="task-card-top">
                <div class="task-tags">
                  <span th:text="${item.project}"></span>
                  <span th:text="${item.priority}"></span>
                </div>
                <span class="task-handle" aria-hidden="true">::</span>
              </div>

              <h3 th:text="${item.title}"></h3>
              <p class="task-summary" th:text="${item.description}"></p>

              <div class="task-meta">
                <span th:text="${item.taskType}"></span>
                <span th:text="${'Owner: ' + item.assignee.displayName}"></span>
                <span th:if="${item.dueDate != null}" th:text="${'Due ' + #temporals.format(item.dueDate, 'MMM d')}"></span>
              </div>

              <div class="task-actions">
                <button type="button" class="secondary open-task-modal">Open</button>
                <a class="text-link" th:href="@{/items/{id}(id=${item.id})}">Full Page</a>
              </div>
            </section>
          </div>
        </article>
      </section>
    </section>

    <form id="status-drop-form" action="/updateStatus" method="post" class="hidden-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <input type="hidden" name="id" id="status-drop-id" />
      <input type="hidden" name="status" id="status-drop-value" />
    </form>

    <dialog id="task-modal" class="task-modal">
      <div class="task-modal-frame">
        <div class="task-modal-head">
          <p class="eyebrow">Task details</p>
          <button type="button" class="modal-close" aria-label="Close task details">Close</button>
        </div>

        <div class="task-modal-content">
          <div class="detail-header">
            <div class="task-tags modal-tags">
              <span id="modal-project"></span>
              <span id="modal-type"></span>
              <span id="modal-priority"></span>
              <span id="modal-status"></span>
            </div>
            <p class="detail-id" id="modal-id"></p>
          </div>

          <h2 class="detail-title" id="modal-title"></h2>
          <p class="detail-description" id="modal-description"></p>

          <div class="detail-grid">
            <section class="detail-card">
              <h3>Ownership</h3>
              <dl class="detail-list">
                <div>
                  <dt>Assignee</dt>
                  <dd id="modal-assignee"></dd>
                </div>
                <div>
                  <dt>Created By</dt>
                  <dd id="modal-created-by"></dd>
                </div>
              </dl>
            </section>

            <section class="detail-card">
              <h3>Schedule</h3>
              <dl class="detail-list">
                <div>
                  <dt>Due Date</dt>
                  <dd id="modal-due-date"></dd>
                </div>
                <div>
                  <dt>Created</dt>
                  <dd id="modal-created-at"></dd>
                </div>
              </dl>
            </section>
          </div>

          <div class="modal-actions">
            <a id="modal-detail-link" class="button-link secondary" href="#">Full Page</a>
            <a id="modal-edit-link" class="button-link" href="#">Edit Task</a>

            <form id="modal-claim-form" action="#" method="post" class="modal-inline-form">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit">Claim And Start</button>
            </form>

            <form id="modal-status-form" action="/updateStatus" method="post" class="modal-inline-form">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <input type="hidden" name="id" id="modal-status-id" />
              <select name="status" id="modal-status-select">
                <option th:each="availableStatus : ${availableStatuses}"
                        th:value="${availableStatus}"
                        th:text="${availableStatus}"></option>
              </select>
              <button type="submit">Update Status</button>
            </form>

            <form id="modal-archive-form" action="#" method="post" class="modal-inline-form">
              <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
              <button type="submit" class="danger">Archive</button>
            </form>
          </div>
        </div>
      </div>
    </dialog>
  </main>
</body>
</html>
