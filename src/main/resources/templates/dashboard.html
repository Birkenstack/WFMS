<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Dashboard</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1>Workflow Control Board</h1>
          <p class="subtle">Track assignments, approvals, and presentation-ready progress across the team.</p>
        </div>
        <div class="meta-row">
          <span class="badge" th:text="${currentUser.displayName}"></span>
          <span class="badge" th:classappend="${isManager} ? ' role-manager' : ' role-employee'" th:text="${currentUser.role}"></span>
        </div>
      </div>

      <div class="toolbar">
        <form action="/" method="get" class="filters">
          <div class="field">
            <label for="project">Project</label>
            <select id="project" name="project">
              <option value="">All projects</option>
              <option th:each="projectOption : ${projects}"
                      th:value="${projectOption}"
                      th:text="${projectOption}"
                      th:selected="${projectOption == projectFilter}"></option>
            </select>
          </div>
          <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="">All priorities</option>
              <option th:each="priorityOption : ${priorities}"
                      th:value="${priorityOption}"
                      th:text="${priorityOption}"
                      th:selected="${priorityOption == selectedPriority}"></option>
            </select>
          </div>
          <button type="submit">Apply Filters</button>
        </form>

        <div class="action-row">
          <a th:if="${isManager}" class="button-link" th:href="@{/create}">New Task</a>
          <form action="/logout" method="post" class="inline-form">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="secondary">Logout</button>
          </form>
        </div>
      </div>

      <div th:if="${message}" class="notice success" th:text="${message}"></div>
      <div th:if="${error}" class="notice error" th:text="${error}"></div>
    </section>

    <p th:if="${#lists.isEmpty(items)}" class="subtle">No tasks matched the current filters.</p>

    <section class="board">
      <article class="board-column" th:each="statusEntry : ${itemsByStatus}">
        <h2 th:text="${statusEntry.key}"></h2>
        <p class="column-count" th:text="${#lists.size(statusEntry.value) + ' item(s)'}"></p>
        <p th:if="${#lists.isEmpty(statusEntry.value)}" class="subtle">No items in this status.</p>

        <div th:if="${!#lists.isEmpty(statusEntry.value)}" class="task-list">
          <section class="task-card" th:each="item : ${statusEntry.value}">
            <div class="task-tags">
              <span th:text="${item.project}"></span>
              <span th:text="${item.taskType}"></span>
              <span th:text="${item.priority}"></span>
            </div>

            <h3 th:text="${item.title}"></h3>
            <p class="subtle" th:text="${item.description}"></p>

            <div class="task-tags">
              <span th:text="${'Assignee: ' + item.assignee.displayName}"></span>
              <span th:text="${'Created by: ' + item.createdBy.displayName}"></span>
              <span th:if="${item.dueDate != null}" th:text="${'Due: ' + item.dueDate}"></span>
            </div>

            <div class="task-actions">
              <form action="/updateStatus" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <input type="hidden" name="id" th:value="${item.id}" />
                <select name="status">
                  <option th:each="availableStatus : ${statuses}"
                          th:value="${availableStatus}"
                          th:text="${availableStatus}"
                          th:selected="${availableStatus == item.status}"></option>
                </select>
                <button type="submit">Update</button>
              </form>

              <a th:if="${isManager}" class="button-link secondary" th:href="@{/items/{id}/edit(id=${item.id})}">Edit</a>

              <form th:if="${isManager}" th:action="@{/items/{id}/archive(id=${item.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="danger">Archive</button>
              </form>
            </div>
          </section>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
