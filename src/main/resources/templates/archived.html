<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archived Tasks</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="hero-top">
        <div>
          <h1>Archived Tasks</h1>
          <p class="subtle">A read-only record of all completed and archived workflow items.</p>
        </div>
        <div class="meta-row">
          <span class="badge" th:text="${currentUser.displayName}"></span>
          <span class="badge role-manager" th:text="${currentUser.role}"></span>
        </div>
      </div>

      <div class="action-row" style="margin-top: 12px;">
        <a class="button-link secondary" th:href="@{/}">Back to Dashboard</a>
      </div>
    </section>

    <p th:if="${#lists.isEmpty(items)}" class="subtle" style="margin-top: 24px;">No archived tasks yet.</p>

    <section class="board" th:if="${!#lists.isEmpty(items)}">
      <div class="task-list" style="max-width: 860px;">
        <section class="task-card" th:each="item : ${items}">
          <div class="task-tags">
            <span th:text="${item.project}"></span>
            <span th:text="${item.taskType}"></span>
            <span th:text="${item.priority}"></span>
            <span style="opacity: 0.6;" th:text="${item.status}"></span>
          </div>

          <h3 th:text="${item.title}"></h3>
          <p class="subtle" th:text="${item.description}"></p>

          <div class="task-tags">
            <span th:text="${'Assignee: ' + item.assignee.displayName}"></span>
            <span th:text="${'Created by: ' + item.createdBy.displayName}"></span>
            <span th:if="${item.dueDate != null}" th:text="${'Due: ' + item.dueDate}"></span>
            <span th:if="${item.createdAt != null}" th:text="${'Created: ' + #temporals.format(item.createdAt, 'MMM d, yyyy')}"></span>
          </div>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
