<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Details</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="hero-top">
        <div>
          <h1>Task Details</h1>
          <p class="subtle">A read-only view of the full workflow item for demos, reviews, and quick status checks.</p>
        </div>
        <div class="meta-row">
          <span class="badge" th:text="${currentUser.displayName}"></span>
          <span class="badge" th:classappend="${isManager} ? ' role-manager' : ' role-employee'" th:text="${currentUser.role}"></span>
        </div>
      </div>

      <div class="action-row" style="margin-top: 18px;">
        <a class="button-link secondary" th:href="@{/}">Back to Dashboard</a>
        <a th:if="${isManager}" class="button-link" th:href="@{/items/{id}/edit(id=${item.id})}">Edit Task</a>
      </div>
    </section>

    <section class="panel detail-panel">
      <div class="detail-header">
        <div class="task-tags">
          <span th:text="${item.project}"></span>
          <span th:text="${item.taskType}"></span>
          <span th:text="${item.priority}"></span>
          <span th:text="${item.status}"></span>
        </div>
        <p class="detail-id" th:text="${'Task #' + item.id}"></p>
      </div>

      <h2 class="detail-title" th:text="${item.title}"></h2>
      <p class="detail-description" th:text="${item.description}"></p>

      <div class="detail-grid">
        <section class="detail-card">
          <h3>Ownership</h3>
          <dl class="detail-list">
            <div>
              <dt>Assignee</dt>
              <dd th:text="${item.assignee.displayName}"></dd>
            </div>
            <div>
              <dt>Created By</dt>
              <dd th:text="${item.createdBy.displayName}"></dd>
            </div>
          </dl>
        </section>

        <section class="detail-card">
          <h3>Schedule</h3>
          <dl class="detail-list">
            <div>
              <dt>Due Date</dt>
              <dd th:text="${item.dueDate != null ? #temporals.format(item.dueDate, 'MMM d, yyyy') : 'No due date'}"></dd>
            </div>
            <div>
              <dt>Created</dt>
              <dd th:text="${item.createdAt != null ? #temporals.format(item.createdAt, 'MMM d, yyyy h:mm a') : 'Unknown'}"></dd>
            </div>
          </dl>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
